services:
  db:
    image: postgres:16-alpine
    container_name: bibliotecabetim-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bibliotecabetim}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - bibliotecabetim_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bibliotecabetim}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: bibliotecabetim-mailhog
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/api/v2/messages"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bibliotecabetim_db_data:
